# ─────────────────────────────────────────────────────────────
# REFERENCE — Fetch the created bundle to verify
# ─────────────────────────────────────────────────────────────
query FetchBundleByHandle($handle: String!) {
  metaobjectByHandle(handle: { type: "bundle_config", handle: $handle }) {
    id
    handle
    type
    updatedAt
    fields {
      key
      value
      type
    }
  }
}

# Variables for the fetch query:
# {
#   "handle": "home-decor-bundle-5"
# }


# ─────────────────────────────────────────────────────────────
# REFERENCE — List all bundle steps for a given config
# ─────────────────────────────────────────────────────────────
query ListBundleSteps {
  metaobjects(type: "bundle_step", first: 50) {
    nodes {
      id
      handle
      fields {
        key
        value
      }
    }
  }
}
